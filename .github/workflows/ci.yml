name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get temporary AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Package the code
        run: zip function.zip handler.py

      - name: Update the Lambda function
        run: |
          aws lambda update-function-code --function-name file-checker --zip-file fileb://function.zip
          aws lambda wait function-updated --function-name file-checker

      - name: Publish a new version
        run: |
          VERSION=$(aws lambda publish-version --function-name file-checker --query Version --output text)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Published version $VERSION"

      - name: Smoke test the new version
        run: |
          aws lambda invoke --function-name file-checker --qualifier $VERSION --cli-binary-format raw-in-base64-out --payload '{"filename":"menu.pdf","size_bytes":2000}' response.json
          cat response.json
          grep -q '"accepted": true' response.json

      - name: Move the live signpost to the new version
        run: |
          aws lambda update-alias --function-name file-checker --name live --function-version $VERSION