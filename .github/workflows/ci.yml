name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Debug - show what GitHub sends
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "
          import sys, json, base64
          jwt = json.load(sys.stdin)['value']
          p = jwt.split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print('sub:', c['sub'])
          print('aud:', c['aud'])
          print('iss:', c['iss'])
          "

      - name: Get temporary AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Package the code
        run: zip function.zip handler.py

      - name: Update the Lambda function
        run: |
          aws lambda update-function-code --function-name file-checker --zip-file fileb://function.zip
          aws lambda wait function-updated --function-name file-checker

      - name: Smoke test
        run: |
          aws lambda invoke --function-name file-checker --cli-binary-format raw-in-base64-out --payload '{"filename":"menu.pdf","size_bytes":2000}' response.json
          cat response.json
          grep -q '"accepted": true' response.json